<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#3F452B"><title>Tabuada em Jogo</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"><link rel="apple-touch-icon" href="./icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><link rel="stylesheet" href="./style-01.css"><link rel="stylesheet" href="./style-02.css"><link rel="stylesheet" href="./style-03.css"><link rel="stylesheet" href="./style-04.css"></head><body><div id="root"></div><script>(async()=>{const parts=['./app-01.part', './app-02.part', './app-03.part', './app-04.part', './app-05.part', './app-06.part', './app-07.part', './app-08.part', './app-09.part', './app-10.part', './app-11.part'];try{const code=(await Promise.all(parts.map(p=>fetch(p).then(r=>{if(!r.ok)throw new Error(p);return r.text()})))).join('');(0,eval)(code)}catch(err){document.querySelector('#root').innerHTML='<main style="padding:2rem;font-family:Arial">Não foi possível carregar o aplicativo. Atualize esta página enquanto estiver conectado à internet.</main>';console.error(err)}})();</script></body></html>
